name: Build & Release Windows (x64 & ARM64)

on:
  push:
    branches: [ main, CC_vibe_coding ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter (x64)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'x64'
          cache: true

      - name: Install dependencies
        run: |
          choco install innosetup -y --no-progress
          pip install httpx

      - name: Download ChineseSimplified.isl (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/ChineseSimplified.isl")) {
            Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/kira-96/Inno-Setup-Chinese-Simplified-Translation@latest/ChineseSimplified.isl" -OutFile "windows/ChineseSimplified.isl"
          }

      - name: Build with custom script (x64)
        shell: pwsh
        run: python windows/build.py

      - name: Verify x64 build output
        shell: pwsh
        run: |
          if (-not (Test-Path "build\windows\x64\runner\Release\venera.exe")) {
            throw "x64 build failed: venera.exe not found."
          }

      - name: Create portable ZIP (x64)
        shell: pwsh
        run: |
          $portableDir = "build/windows/x64/runner/Release"
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value -replace '\+.*$'
          $zipPath = "build/windows/Venera-Prime-$version-windows-x64-portable.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipPath -Force
          Write-Host "Portable ZIP created: $zipPath"

      - name: Upload x64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64
          path: |
            build/windows/x64/runner/Release/
            build/windows/Venera-Prime-*-windows-installer.exe
            build/windows/Venera-Prime-*-windows-x64-portable.zip
          if-no-files-found: error

  build-arm64:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter (ARM64, master channel)
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'          # 关键：只有 master 频道支持 Windows ARM64
          architecture: 'arm64'
          cache: true

      - name: Install dependencies
        run: |
          choco install innosetup -y --no-progress
          pip install httpx

      - name: Download ChineseSimplified.isl (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/ChineseSimplified.isl")) {
            Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/kira-96/Inno-Setup-Chinese-Simplified-Translation@latest/ChineseSimplified.isl" -OutFile "windows/ChineseSimplified.isl"
          }

      - name: Build with custom script (ARM64)
        shell: pwsh
        run: python windows/build_arm64.py

      - name: Verify ARM64 build output
        shell: pwsh
        run: |
          $exe = "build\windows\arm64\runner\Release\venera.exe"
          if (-not (Test-Path $exe)) {
            throw "ARM64 build failed: venera.exe not found."
          }
          Write-Host "ARM64 executable found: $exe"

      - name: Create portable ZIP (ARM64)
        shell: pwsh
        run: |
          $portableDir = "build/windows/arm64/runner/Release"
          $version = (Get-Content pubspec.yaml | Select-String '^version:\s*(.+)$').Matches.Groups[1].Value -replace '\+.*$'
          $zipPath = "build/windows/Venera-Prime-$version-windows-arm64-portable.zip"
          Compress-Archive -Path "$portableDir\*" -DestinationPath $zipPath -Force
          Write-Host "Portable ZIP created: $zipPath"

      - name: Upload ARM64 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64
          path: |
            build/windows/arm64/runner/Release/
            build/windows/Venera-Prime-*-windows-arm64-installer.exe
            build/windows/Venera-Prime-*-windows-arm64-portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-x64, build-arm64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/windows-x64/Venera-Prime-*-windows-installer.exe
            artifacts/windows-x64/Venera-Prime-*-windows-x64-portable.zip
            artifacts/windows-arm64/Venera-Prime-*-windows-arm64-installer.exe
            artifacts/windows-arm64/Venera-Prime-*-windows-arm64-portable.zip
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}