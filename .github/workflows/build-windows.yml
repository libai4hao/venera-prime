name: Build Flutter Windows (x64 & ARM64)

on:
  push:
    branches: [ main, CC_vibe_coding ] # 根据你的主分支调整
  workflow_dispatch: # 允许手动触发

jobs:
  build-x64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: . # 如果你的 Flutter 项目在子目录，请修改此路径

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'x64'
          cache: true # 缓存 Flutter SDK，加速后续构建

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup & Dependencies
        run: |
          # 安装 Inno Setup，choco 在 CI 中比 winget 更可靠
          choco install innosetup -y --no-progress
          # 确保 iscc 在 PATH 中 (choco 通常会自动处理，但显式添加更稳妥)
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) { echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          # 安装 Python 依赖
          pip install httpx

      - name: Download ChineseSimplified.isl (如果不存在)
        run: |
          $islPath = "windows/ChineseSimplified.isl"
          if (-not (Test-Path $islPath)) {
            Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/kira-96/Inno-Setup-Chinese-Simplified-Translation@latest/ChineseSimplified.isl" -OutFile $islPath
          }

      - name: Verify Flutter Build Output (Pre-check)
        shell: pwsh
        run: |
          # 在构建前检查项目结构，确保关键文件存在
          if (-not (Test-Path "pubspec.yaml")) { throw "pubspec.yaml not found" }
          if (-not (Test-Path "windows/build.iss")) { throw "windows/build.iss not found" }
          Write-Host "✅ Project structure looks good."

      - name: Build with custom script (x64)
        shell: pwsh
        run: |
          # 使用你的 build.py 脚本进行完整构建（包含打包和安装包生成）
          python windows/build.py
          # 检查构建是否真的成功
          $exePath = "build\windows\x64\runner\Release\venera.exe"
          if (-not (Test-Path $exePath)) {
            throw "❌ Flutter build failed: venera.exe not found at $exePath"
          }
          Write-Host "✅ x64 Build completed successfully."

      - name: Upload x64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venera-prime-windows-x64
          path: |
            build/windows/x64/runner/Release/
            build/windows/Venera-Prime-*-windows-installer.exe
          if-no-files-found: error # 如果找不到文件则直接报错，避免静默失败
          retention-days: 7

  build-arm64:
    runs-on: windows-latest
    # 仅在手动触发或特定条件下运行 ARM64 构建（可选）
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter (ARM64)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: 'arm64' # 关键：指定 ARM64 架构
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup & Dependencies
        run: |
          choco install innosetup -y --no-progress
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (Test-Path $innoPath) { echo "$innoPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append }
          pip install httpx

      - name: Download ChineseSimplified.isl (如果不存在)
        run: |
          $islPath = "windows/ChineseSimplified.isl"
          if (-not (Test-Path $islPath)) {
            Invoke-WebRequest -Uri "https://cdn.jsdelivr.net/gh/kira-96/Inno-Setup-Chinese-Simplified-Translation@latest/ChineseSimplified.isl" -OutFile $islPath
          }

      - name: Verify Flutter Build Output (Pre-check)
        shell: pwsh
        run: |
          if (-not (Test-Path "pubspec.yaml")) { throw "pubspec.yaml not found" }
          if (-not (Test-Path "windows/build_arm64.iss")) { throw "windows/build_arm64.iss not found" }

      - name: Build with custom script (ARM64)
        shell: pwsh
        run: |
          # 确保你的 build_arm64.py 脚本能正确处理 ARM64 构建
          # 注意：flutter build windows --release 需要能识别 ARM64 目标
          python windows/build_arm64.py
          $exePath = "build\windows\arm64\runner\Release\venera.exe"
          if (-not (Test-Path $exePath)) {
            throw "❌ ARM64 build failed: venera.exe not found at $exePath"
          }
          Write-Host "✅ ARM64 Build completed successfully."

      - name: Upload ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: venera-prime-windows-arm64
          path: |
            build/windows/arm64/runner/Release/
            build/windows/Venera-Prime-*-windows-arm64-installer.exe
          if-no-files-found: error
          retention-days: 7